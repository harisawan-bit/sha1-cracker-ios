name: Build iOS IPA (A17 Pro SHA-1 Cracker)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Metal iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Compile Metal & Build iOS App Bundle
        run: |
          xcodebuild -project sha1-cracker-ios.xcodeproj \
            -scheme sha1-cracker-ios \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            BUILD_DIR=build \
            clean build

      - name: Package Payload into Sideloadable IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Release-iphoneos/sha1-cracker-ios.app build/Payload/
          cd build
          zip -r sha1-cracker-ios.ipa Payload
          ls -la sha1-cracker-ios.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sha1-cracker-ios
          path: build/sha1-cracker-ios.ipa
          if-no-files-found: error
          retention-days: 14
